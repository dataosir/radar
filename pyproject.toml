[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-radar"
version = "0.1.0"
description = "CHAT-RADAR — 多源聊天历史个人雷达与摘要"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [{ name = "renwentao" }]
keywords = ["telegram", "wechat", "chat", "digest", "summary", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "telethon>=1.36",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[project.scripts]
chat_radar = "chat_radar.runtime.cli:main"

[tool.setuptools]
packages = [
    "chat_radar",
    "chat_radar.core",
    "chat_radar.config",
    "chat_radar.ingest",
    "chat_radar.filter",
    "chat_radar.reporting",
    "chat_radar.runtime",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
